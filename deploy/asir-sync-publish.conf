# Instalar solo tras validar sesión, ensayo y bootstrap reconciliado.
# /etc/systemd/system/asir-sync.service.d/publish.conf
# La primera migración del corpus existente NO usa --legacy-full-publish:
# se ejecuta a mano `scripts/rag_publish --install-schema` y después
# `--bootstrap` contra la copia publicada (reconciliación SQL server-side).
# Esta línea repite la ExecStart base con publicación activa; si omite
# --rag-delta-publish o --rag-resource-map el publicador fallaría con
# rag_migration_activation_required o rag_resource_map_required.
[Service]
# sudo necesita elevarse; sudoers limita el único comando permitido.
NoNewPrivileges=no
ExecStart=
ExecStart=/opt/asir/venv/bin/python /opt/asir-sync/app/scripts/sync_materials.py --execute --rag-delta-publish --staging --publish --scheduled --data-root /var/lib/asir-sync/data --state-dir /var/lib/asir-sync --session-file /etc/asir-sync/moodle-session.json --credentials-file /etc/asir-sync/moodle-credentials.json --database-config /etc/asir-sync/database.json --model /var/lib/asir/models/multilingual-e5-small --tessdata /var/lib/asir-sync/tessdata --rag-resource-map /var/lib/asir-sync/resource-registry.json --rollback-candidate /var/lib/asir-sync/bootstrap --probe-token-file /etc/asir-sync/probe-token
